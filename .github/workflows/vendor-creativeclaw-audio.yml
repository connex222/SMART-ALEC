name: Bundle Creative Claw audio locally
on:
  push:
    branches: [fix/vendor-creativeclaw-audio]
    paths: ['CREATIVE-CLAW-AUDIO-SOURCES.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node tools/vendor-creativeclaw-audio.mjs
      - run: npm ci && npm test
      - name: Commit original music and size report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/sounds/mus-lobby-original.mp3 AUDIO_VENDOR_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: bundle original Smart Alec music'
            git push
          fi
