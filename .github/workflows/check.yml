# Runs on every upload to GitHub. A red cross means something is broken:
# open the run on the Actions tab to see which check failed and why.
name: Check Smart Alec

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Code, questions, files, rules and server
        run: npm run verify

      - name: Question file matches the source question packs
        run: |
          node tools/build-questions.js > /dev/null
          node - <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const committed = JSON.parse(execFileSync('git', ['show', 'HEAD:data/questions.json'], {encoding:'utf8', maxBuffer: 32 * 1024 * 1024}));
          const rebuilt = JSON.parse(fs.readFileSync('data/questions.json', 'utf8'));
          // builtAt is a generation date, not a question/content change.
          // Compare the actual question bank so CI remains stable across midnight.
          delete committed.builtAt;
          delete rebuilt.builtAt;
          if (JSON.stringify(committed) !== JSON.stringify(rebuilt)) {
            console.error('::error::data/questions.json differs from the source question packs. Run npm run questions and commit the refreshed file.');
            process.exit(1);
          }
          console.log('Question bank matches its sources (ignoring generation date).');
          NODE
