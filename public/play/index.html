<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A33">
<title>Smart Alec</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/play/play.css">
</head>
<body class="phone">
<main class="app">

  <section id="view-join" class="view" hidden>
    <h1 class="logo">Smart Alec</h1>
    <label class="field"><span>Room code</span>
      <input id="join-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCD">
    </label>
    <label class="field"><span>Your name</span>
      <input id="join-name" maxlength="16" autocomplete="nickname" placeholder="Name on the TV">
    </label>
    <p class="field-label">Pick a character</p>
    <div id="join-avatars" class="avatar-grid"></div>
    <p id="join-picked" class="picked">Tap a character</p>
    <button id="btn-join" class="btn btn-gold btn-big">Join the game</button>
    <p id="join-error" class="error" role="alert"></p>
  </section>

  <section id="view-lobby" class="view" hidden>
    <div id="lobby-me" class="lobby-me"></div>
    <button id="btn-ready" class="btn btn-gold btn-huge">I'm ready</button>
    <p id="lobby-status" class="status-line"></p>
    <button id="btn-start" class="btn btn-ghost btn-big" hidden>Start the show</button>
    <details class="change">
      <summary>Change character</summary>
      <div id="lobby-avatars" class="avatar-grid"></div>
    </details>
    <button id="btn-leave" class="link">Leave this game</button>
  </section>

  <section id="view-game" class="view view-game" hidden>
    <header class="me-bar" id="me-bar"></header>
    <div class="phone-timer" id="phone-timer" hidden><div id="phone-timer-fill"></div></div>
    <div id="panel" class="panel"></div>
    <p id="game-banner" class="game-banner"></p>
  </section>

  <section id="view-over" class="view" hidden>
    <div id="over-box" class="over-box"></div>
    <button id="btn-again" class="btn btn-gold btn-big" hidden>Play again</button>
  </section>

  <div id="offline" class="offline" hidden>Reconnecting…</div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared/client.js"></script>
<script src="/play/play.js"></script>
</body>
</html>
